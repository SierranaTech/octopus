[tools]
go = "1.26.2"
golangci-lint = "2.11.4"
prek = "latest"

[tasks.tidy]
description = "Tidy Go module files"
run = "go mod tidy"

[tasks.fmt]
depends = ["tidy"]
description = "Format Go source files"
run = "gofmt -w ."

[tasks.lint]
depends = ["fmt"]
description = "Run linters"
run = "go vet ./... && golangci-lint run ./..."

[tasks.test]
depends = ["lint"]
description = "Run unit tests"
run = "go test ./... -count=1 -race -v --cover"

[tasks.build]
depends = ["lint"]
description = "Build all packages"
run = "go build ./..."

[tasks.sync-lint-config]
description = "Sync .golangci.yml from SierranaTech/actions (canonical)"
# gh api rather than curl: actions repo is private, so the fetch needs
# the caller's gh auth (locally) or a GITHUB_TOKEN with contents:read on
# that repo (CI). See SierranaTech/actions/golangci-lint/README.md.
# Write to a temp file first: on failure, .golangci.yml is preserved
# (a naive redirect would clobber it with the 4xx error body).
run = '''
set -euo pipefail
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
gh api -H 'Accept: application/vnd.github.raw' \
  'repos/SierranaTech/actions/contents/golangci-lint/common.yml' > "$tmp"
mv "$tmp" .golangci.yml
'''
