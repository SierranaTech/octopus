name: Test and Lint

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            nine-cli
            platform

      - name: Run Tests
        run: mise run unit_tests
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Fetch service catalog schema
        shell: bash
        run: mise run fetch_servicecatalog_schema
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN }}

      # Fail pipeline if go.mod changes on go tidy
      - name: Go mod tidy -diff
        shell: bash
        run: go mod tidy -diff

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          # Mise installs the version in use
          install-mode: none
