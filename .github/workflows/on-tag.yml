name: On Tag deploy
run-name: Release version ${{ github.ref_name }}

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  test-and-lint:
    uses: ./.github/workflows/test-and-lint.yml
    secrets: inherit

  terraform-apply:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    needs: test-and-lint
    uses: 9fin/gha-terraform/.github/workflows/terraform.yml@v2
    with:
      aws_account_name: "core-platform-prod"
      aws_enabled: true
      tf_apply_enabled: true
      tf_apply_timeout: 20
      tf_dir: "terraform/releases"
      tf_plan_timeout: 5
      tf_version: "~1.14.0"
    secrets: inherit

  go-releaser:
    runs-on: 9fin-ubuntu-small-amd64
    timeout-minutes: 10
    needs:
      - terraform-apply
    permissions:
      # This job will upload packages and create a release, so gets contents: write
      contents: write
      id-token: write
    env:
      BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
    steps:
      - name: Fetch AWS Account Data
        id: fetch-aws-account
        uses: 9fin/gha-aws/get-aws-account-metadata@v1
        with:
          account_name: "core-platform-prod"

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.fetch-aws-account.outputs.account_id }}:role/github-deploy
          role-session-name: go-releaser
          aws-region: eu-west-1

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            nine-cli
            platform

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - run: mise run fetch_servicecatalog_schema
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # v7.1.0
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
