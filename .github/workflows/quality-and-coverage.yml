name: quality-and-coverage

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  report:
    runs-on: 9fin-ubuntu-small-amd64
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install goreportcard CLI
        run: |
          go install github.com/gojp/goreportcard/cmd/goreportcard-cli@latest

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Run tests with coverage
        shell: bash
        run: |
          mkdir -p .artifacts
          mise run unit_tests
          go test -skip="TestNineAWS*" -covermode=atomic -coverprofile=.artifacts/coverage.out ./...
          go tool cover -func=.artifacts/coverage.out | tee .artifacts/coverage-summary.txt

      - name: Run local quality grade
        run: |
          mkdir -p .artifacts
          "$(go env GOPATH)/bin/goreportcard-cli" ./... | tee .artifacts/goreportcard.txt

      - name: Generate badges and README fragment
        run: |
          python3 .github/scripts/generate_quality_assets.py

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-and-coverage
          path: |
            .artifacts/coverage.out
            .artifacts/coverage-summary.txt
            .artifacts/goreportcard.txt
            .github/badges/coverage.svg
            .github/badges/quality.svg

      - name: Commit generated assets
        run: |
          if git diff --quiet -- .github/badges README.md; then
            echo "No generated changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges README.md
          git commit -m "chore: update quality and coverage badges"
          git push
