name: Test and Lint

on:
  push:
    branches:
      - main
  workflow_call: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: SierranaTech/actions/go-suite@main

  report:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: SierranaTech/actions/go-suite@main
        with:
          run-report: "true"
