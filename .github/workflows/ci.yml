name: Test and Lint

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: SierranaTech/actions/go-suite@main

  report:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: SierranaTech/actions/go-suite@main
        with:
          run-report: "true"
