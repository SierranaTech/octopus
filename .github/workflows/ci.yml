name: Test and Lint

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: homelab-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: SierranaTech/actions/go-suite@main

  report:
    needs: ci
    runs-on: homelab-small
    if: github.ref_name == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: SierranaTech/actions/go-suite@main
        with:
          run-report: "true"
