name: Test and Lint

on:
  push:
    branches:
      - main
  workflow_call: {}

jobs:
  ci:
    runs-on: homelab-small
    timeout-minutes: 10
    steps:
      - uses: SierranaTech/actions/setup@main
        with:
          go: true

      - uses: SierranaTech/actions/go-suite@main

  report:
    needs: ci
    runs-on: homelab-small
    if: github.ref_name == 'main'
    timeout-minutes: 10
    steps:
      - uses: SierranaTech/actions/setup@main
        with:
          go: true
          fetch-depth: 0

      - uses: SierranaTech/actions/go-suite@main
        with:
          run-report: "true"
