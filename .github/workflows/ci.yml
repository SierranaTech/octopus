name: Test and Lint

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: SierranaTech/actions/go-suite@main

  report:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: SierranaTech/actions/go-suite@main
        with:
          run-report: "true"
