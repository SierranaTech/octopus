concurrency: ci-${{ github.ref }}

name: CI Pipeline

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "00 8 * * 1"

jobs:
  lint:
    name: Code lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: .
          args: --issues-exit-code=1

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: Run tests
        run: go test ./... -count=1 -race -v --cover
